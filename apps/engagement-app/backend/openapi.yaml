      properties:
        assign: { type: boolean }
        update: { type: boolean }
        editStatus: { type: boolean }
        editAgency: { type: boolean }
        editVisa: { type: boolean }
        addPerDiem: { type: boolean }
        deletePerDiem: { type: boolean }
        addInvoice: { type: boolean }
        addTravelCard: { type: boolean }
        addPayment: { type: boolean }
        editPayment: { type: boolean }
        pushPayments: { type: boolean }
