        segmentCounts:
          type: object
          additionalProperties: { type: integer }
    TravelRequestDetail:
      allOf:
        - $ref: '#/components/schemas/TravelRequestSummary'
        - type: object
          required: [scope, tabs]
          properties:
            scope: { type: string, enum: [full, agency, own] }
            allocationId: { type: string, nullable: true }
            visaId: { type: integer, nullable: true }
            engagementCode: { type: string, nullable: true }
            engagementType: { type: string, nullable: true }
            address: { type: string, nullable: true }
