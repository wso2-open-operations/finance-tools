            tabs:
              type: object
              properties:
                perDiems: { type: boolean }
                invoices: { type: boolean }
                travelCards: { type: boolean }
                expenses: { type: boolean, description: 'Card spend and expense claims (Travel 45, full scope only).' }
                payments: { type: boolean }
            counts:
              type: object
              description: Row counts of the visible tabs, equal to what each tab's endpoint returns. A key is absent when its tab is hidden or the count failed.
              properties:
                perDiems: { type: integer }
                invoices: { type: integer }
                payments: { type: integer }
                cardExpenses: { type: integer }
                expenseClaims: { type: integer }
    TravelRequestUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/TravelStatus' }
        agency: { type: string, description: 'The name of an Active travel agent.' }
        visa:
          type: string
          description: A visa id from visa-options (one of the traveller's visas), or "Visa Not Applicable" / "No Valid Visa Available".
    VisaOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
    PerDiem:
      type: object
      properties:
        id: { type: integer }
        jobNumber: { type: string }
        startDate: { type: string, format: date }
        startTime: { type: string, example: '09:00' }
        endDate: { type: string, format: date }
        endTime: { type: string, example: '18:00' }
        days: { type: number }
        currency: { type: string }
        rate: { type: number }
        total: { type: number }
        addedBy: { type: string, nullable: true, description: 'Set only on the create response (not stored on the per diem).' }
        canDelete: { type: boolean }
    PerDiemCreate:
      type: object
      required: [startDate, startTime, endDate, endTime, currency, rate]
      properties:
        startDate: { type: string, format: date }
        startTime: { type: string }
        endDate: { type: string, format: date }
        endTime: { type: string }
        currency: { type: string }
        rate: { type: number, exclusiveMinimum: true, minimum: 0 }
    InvoiceCreate:
      type: object
      required: [invoiceNumber, month, costType, amount, currency]
      properties:
        invoiceNumber: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        month: { type: string, example: October }
        costType: { type: string, description: 'An active cost type name (inv_cost_type), e.g. Air Ticket.' }
        amount: { type: number, exclusiveMinimum: true, minimum: 0 }
        currency: { type: string, enum: [LKR, USD] }
        paidAmount: { type: number, minimum: 0, nullable: true, description: 'Optional, as in legacy; needs paidCurrency when more than 0.' }
        paidCurrency: { type: string, nullable: true, description: Optional. }
    Invoice:
      type: object
      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        jobNumber: { type: string }
        traveller: { $ref: '#/components/schemas/Person' }
        agency: { type: string, nullable: true, description: 'Not returned to agents (it is their own).' }
        month: { type: string }
        costType: { type: string }
        amount: { type: number }
        currency: { type: string }
        paidAmount: { type: number }
        paidCurrency: { type: string }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        poApproval: { $ref: '#/components/schemas/ApprovalState' }
        financeApproval: { $ref: '#/components/schemas/ApprovalState' }
        poApprovedBy: { type: string, nullable: true }
        financeApprovedBy: { type: string, nullable: true }
        rejectReason: { type: string, nullable: true }
        netsuite: { $ref: '#/components/schemas/NetSuiteState' }
        campaign: { $ref: '#/components/schemas/CampaignRef' }
        destination: { type: string, nullable: true }
        travelStartDate: { type: string, format: date, nullable: true }
        travelEndDate: { type: string, format: date, nullable: true }
        addedOn: { type: string, format: date }
        addedBy: { type: string, nullable: true }
        actions:
          type: object
          properties:
            approvePo: { type: boolean }
            approve: { type: boolean }
            reject: { type: boolean }
            push: { type: boolean }
            resync: { type: boolean }
    InvoicePage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        total: { type: integer }
        tabCounts:
          type: object
          additionalProperties: { type: integer }
    TripExpenses:
      type: object
      description: Card spend (expense_app.cc_txn, except invalid) and expense claims (expense_app.expense_claims, except deleted) tagged with the travel's job number.
      properties:
        cardExpenses:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              date: {type: string, nullable: true}
              expenseType: {type: string, nullable: true}
              reference: {type: string, nullable: true}
              amount: {type: number, nullable: true}
              currency: {type: string, nullable: true}
              employeeEmail: {type: string, nullable: true}
              status: {type: string, nullable: true}
        expenseClaims:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              claimNumber: {type: string, nullable: true}
              date: {type: string, nullable: true}
              expenseType: {type: string, nullable: true}
              amount: {type: number, nullable: true}
              currency: {type: string, nullable: true}
              reimbursementAmount: {type: number, nullable: true}
              reimbursementCurrency: {type: string, nullable: true}
              employeeEmail: {type: string, nullable: true}
              status: {type: string, nullable: true, description: '0 pending approval, 1 rejected, 2 lead approved, 3 approved.'}
    TravelCard:
      type: object
      properties:
        id: { type: integer }
        jobNumber: { type: string }
        currency: { type: string }
        amount: { type: number }
        addedBy: { type: string }
        addedOn: { type: string, format: date }
    PerDiemPayment:
      type: object
      properties:
        id: { type: string, example: TRV-2026-10-1246-001 }
        jobNumber: { type: string }
        traveller: { $ref: '#/components/schemas/Person' }
        amount: { type: number }
        currency: { type: string }
        convertedAmount: { type: number, nullable: true }
        convertedCurrency: { type: string, nullable: true }
        status: { type: string, enum: [Pending, Complete] }
        netsuite: { $ref: '#/components/schemas/NetSuiteState' }
        campaign: { $ref: '#/components/schemas/CampaignRef' }
        addedOn: { type: string, format: date }
        addedBy: { type: string, nullable: true }
        actions:
          type: object
          properties:
            edit: { type: boolean }
            push: { type: boolean }
            resync: { type: boolean }
    PerDiemPaymentPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PerDiemPayment' } }
        total: { type: integer }
        tabCounts:
          type: object
          additionalProperties: { type: integer }
    TravelRequestPayments:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PerDiemPayment' } }
        summary:
          type: object
          nullable: true
          description: Null when the request has no per diems.
          properties:
            currency: { type: string }
            totalPerDiemAmount: { type: number }
            initialCurrencyPaid: { type: number }
            totalTravelCardAmount: { type: number }
            totalPaymentAmount: { type: number }
            remainingBalance: { type: number }
            convertedCurrency: { type: string, nullable: true }
    SyncFailure:
      type: object
      required: [record, id, jobNumber]
      properties:
        record: { type: string, enum: [invoice, payment] }
        id: { type: string, description: 'Invoice id or payment number.' }
        number: { type: string }
        agency: { type: string, nullable: true }
        jobNumber: { type: string }
        traveller: { $ref: '#/components/schemas/Person' }
        campaign: { $ref: '#/components/schemas/CampaignRef' }
        amount: { type: number }
        currency: { type: string }
        netsuite: { $ref: '#/components/schemas/NetSuiteState' }
    BatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, ok]
            properties:
              id: { type: string }
              ok: { type: boolean }
              message: { type: string, nullable: true }
              netsuiteReference: { type: string, nullable: true }

    ConsultantAllocationRow:
      type: object
      properties:
        engagementType: { type: string }
        engagementLocation: { type: string }
        country: { type: string }
        allocationType: { type: string }
        consultantEmail: { type: string }
        department: { type: string }
        employeeBusinessUnit: { type: string }
        company: { type: string }
        engagementCode: { type: string }
        dailyOrHourly: { type: string, enum: [Daily, Hourly] }
        calendarDays: { type: number }
        workingDays: { type: number }
        workingHours: { type: number, nullable: true }
        engagementBusinessUnit: { type: string }
        engagementSalesPod: { type: string }
        engagementGroup: { type: string }
        accountName: { type: string }
        glCode: { type: string }

    # ── Visas and documents ──
    Visa:
      type: object
      properties:
        id: { type: integer }
        traveller: { $ref: '#/components/schemas/Person' }
        country: { type: string }
        visaType: { type: string }
        entryType: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        issuedDate: { type: string, format: date }
        passport:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            country: { type: string }
            maskedNumber: { type: string }
            issuedDate: { type: string, format: date }
            expiryDate: { type: string, format: date }
        status: { type: string, enum: [Active, Inactive, Expired] }
        hasImage: { type: boolean }
    VisaPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Visa' } }
        total: { type: integer }
    VisaForm:
      type: object
      description: >-
        Unless the visa is set Inactive, the passport (one of the traveller's
        passports) and an image are required, as in the legacy dialog. On edit
        an empty field keeps the stored value, and Expired with an end date
        still ahead sets the end date to today.
      required: [country, visaType, entryType, issuedDate, startDate, endDate]
      properties:
        travellerEmail: { type: string, description: 'Travel Team add only.' }
        country: { type: string }
        visaType: { type: string }
        entryType: { type: string }
        issuedDate: { type: string, format: date }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        passportId: { type: integer }
        status: { type: string, enum: [Active, Inactive, Expired], description: 'Edit only.' }
        image: { type: string, format: binary, description: 'JPEG or PNG, at most 5 MB. Required on add.' }
    TravelDocument:
      type: object
      properties:
        id: { type: integer }
        traveller: { $ref: '#/components/schemas/Person' }
        documentType: { type: string }
        maskedNumber: { type: string, description: 'Shown masked, e.g. N•••••913.' }
        documentNumber: { type: string, description: 'The full number, only on GET /travel-documents/{documentId} to holders of Edit Travel Document (13), to prefill the edit form.' }
        country: { type: string }
        issuedDate: { type: string, format: date }
        expiryDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [Active, Inactive, Expired] }
        hasImage: { type: boolean }
    TravelDocumentPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TravelDocument' } }
        total: { type: integer }
    TravelDocumentForm:
      type: object
      description: >-
        Add needs every field except expiryDate for Other ID Document, and the
        image. On edit an empty field keeps the stored value. Messages are the
        legacy dialog texts ("Please check the form again", "Please check the
        dates again").
      required: [documentType, country, issuedDate]
      properties:
        travellerEmail: { type: string }
        documentType: { type: string }
        documentNumber: { type: string, description: 'Required on add; empty on edit keeps the stored number.' }
        country: { type: string }
        issuedDate: { type: string, format: date }
        expiryDate: { type: string, format: date, description: 'Not required for Other ID Document.' }
        status: { type: string, enum: [Active, Inactive], description: 'Edit only.' }
        image: { type: string, format: binary }

    # ── Settings ──
    RoleWithPrivileges:
      type: object
      required: [id, name, privilegeIds]
      properties:
        id: { type: integer }
        name: { type: string }
        privilegeIds: { type: array, items: { type: integer } }
    RoleSettings:
      type: object
      required: [roles, privileges]
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/RoleWithPrivileges' } }
        privileges:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              description: { type: string, nullable: true }
