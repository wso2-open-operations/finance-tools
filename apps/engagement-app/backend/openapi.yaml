        region: { type: string }
        subRegion: { type: string, nullable: true }
        businessUnit: { type: string }
        productUnit: { type: string, nullable: true }
        percentage: { type: number, nullable: true, minimum: 1, maximum: 100 }
    EngagementActions:
      type: object
      description: What the caller may do now (legacy privilege and state rules).
      properties:
        allocate: { type: boolean }
        edit: { type: boolean }
        editPending: { type: boolean }
        approve: { type: boolean }
        complete: { type: boolean, description: 'Mark as Completed or Reopen.' }
        changeEngagementStatus: { type: boolean }
        changeAllocationStatus: { type: boolean }
    EngagementSummary:
      type: object
      required: [id, kind, engagementTypeId, title, requestStatus, engagementStatus]
      properties:
        id: { type: string, example: E07201 }
        kind: { $ref: '#/components/schemas/EngagementKind' }
        engagementTypeId: { type: integer }
        engagementTypeName: { type: string }
        account: { type: string, nullable: true }
        title: { type: string, description: 'Opportunity name, Event Name or name / purpose.' }
        campaign: { $ref: '#/components/schemas/CampaignRef' }
        allocationType: { type: string }
        engagementCode: { type: string }
        nature: { type: string }
        city: { type: string, nullable: true }
        country: { type: string }
        businessUnit: { type: string, nullable: true }
        fundingSources: { type: array, items: { $ref: '#/components/schemas/FundingSource' } }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        requestStatus: { $ref: '#/components/schemas/RequestStatus' }
        engagementStatus: { $ref: '#/components/schemas/EngagementStatus' }
        createdBy: { $ref: '#/components/schemas/Person' }
        createdOn: { type: string, format: date-time }
