    EngagementPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EngagementSummary' } }
        total: { type: integer }
        segmentCounts:
          type: object
          additionalProperties: { type: integer }
    EngagementDetail:
      allOf:
        - $ref: '#/components/schemas/EngagementSummary'
        - type: object
          required: [scope]
          properties:
            scope: { type: string, enum: [full, roster, consultants] }
            tentativeDates: { type: boolean }
            accountId: { type: string, nullable: true }
            opportunityId: { type: string, nullable: true }
            opportunityLineItemId: { type: string, nullable: true }
            product: { type: string, nullable: true }
            productUnit: { type: string, nullable: true }
            salesSubRegion: { type: string, nullable: true }
            address: { type: string, nullable: true }
            description: { type: string, nullable: true }
            customerContact: { type: string, nullable: true }
            businessDomain: { type: string, nullable: true }
            opportunityOwner: { type: string, nullable: true }
            technicalOwner: { type: string, nullable: true }
            contractsSigned: { type: boolean, nullable: true }
            engagementScope: { type: string, nullable: true }
            comments: { type: string, nullable: true }
            allocations:
              type: array
              description: Scope-filtered. In `consultants` scope only consultant and dates are set.
              items: { $ref: '#/components/schemas/Allocation' }
            cascadePreview:
              type: object
              description: What cancelling would change.
              properties:
                activeAllocations: { type: integer }
                openTravelRequests: { type: integer }
    EngagementCreate:
      type: object
      required: [engagementTypeId, allocationTypeId, nature, country, address, startDate, endDate]
      properties:
        engagementTypeId: { type: integer }
        accountId: { type: string, description: 'Customer types.' }
        opportunityId: { type: string, description: 'Customer types.' }
        opportunityLineItemId: { type: string, description: 'Required for paid types 6, 7; optional for 4.' }
        campaignId: { type: string, description: 'Marketing Event (5): required; an active Salesforce campaign, stored in engagement.campaign_id.' }
        campaignName: { type: string, deprecated: true, description: 'Ignored (the campaign is looked up by id).' }
        title: { type: string, maxLength: 100, description: 'Internal Engagement (1): Name / Purpose. Marketing Event (5): Event Name (required).' }
        description: { type: string }
        allocationTypeId: { type: integer }
        nature: { type: string }
        country: { type: string }
        address: { type: string, maxLength: 300 }
        businessUnit: { type: string }
        productUnit: { type: string }
        fundingSources: { type: array, items: { $ref: '#/components/schemas/FundingSource' }, description: 'Marketing Event: must total 100%.' }
        salesSubRegion: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        customerContact: { type: string }
        businessDomain: { type: string }
        engagementScope: { type: string }
        comments: { type: string }
        tentativeDates: { type: boolean, description: 'Tentative Dates (customer engagements, legacy checkbox). Paid types (2, 6, 7) take it from the line item''s isTentativeDates; the request value is ignored.' }
    EngagementUpdate:
      type: object
      description: Only the fields sent are changed.
      properties:
        nature: { type: string }
        address: { type: string, maxLength: 300 }
        businessUnit: { type: string }
        productUnit: { type: string }
        customerContact: { type: string }
        engagementScope: { type: string }
        comments: { type: string }
        tentativeDates: { type: boolean, description: Customer engagements. }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        description: { type: string }
        fundingSources: { type: array, items: { $ref: '#/components/schemas/FundingSource' } }
        allocationTypeId: { type: integer, description: 'Pending Approval only.' }
        country: { type: string, description: 'Pending Approval only.' }
        title: { type: string, description: 'Pending Approval internal engagements only.' }
        campaignId: { type: string, description: 'Events: while Pending Approval, or to add one to an event that has none. Does not change the Event Name.' }
        campaignName: { type: string, deprecated: true, description: 'Ignored (the campaign is looked up by id).' }
        salesSubRegion: { type: string, description: 'Pending Approval only.' }
        refreshDatesFromSalesforce: { type: boolean, description: 'Fetch New Dates (paid types).' }
        approve: { type: boolean, description: 'Confirm and Approve (Allocations 28).' }

    # ── Allocations ──
