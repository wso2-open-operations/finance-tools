        engagementId: { type: string }
        engagementTitle: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        clearanceStatus: { type: string, allOf: [{ $ref: '#/components/schemas/ClearanceStatus' }], nullable: true }
        current: { type: boolean, description: 'Covers today.' }
        canOpen: { type: boolean, description: 'The person may open the engagement (as on My Allocations).' }
    AllocationCreate:
      type: object
      required: [startDate, endDate, travelRequired]
      properties:
        consultantEmail: { type: string, description: An employee. }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        hourly: { $ref: '#/components/schemas/Hourly' }
        clearanceStatus:
          type: string
          enum: [Tentative, Clearance In Progress, Confirmed, Confirmed - Visa Pending]
          description: Internal engagements and events only; default Tentative.
        tentative: { type: boolean, description: 'Customer engagements: save as Tentative.' }
        travelRequired: { type: boolean }
        comment: { type: string, maxLength: 255 }
        preparationStart: { type: string, format: date, description: 'Paid types; adds an Engagement Overhead team allocation.' }
        postEngagementEnd: { type: string, format: date, description: 'Paid types; adds an Engagement Overhead team allocation.' }
        trimDefaultAllocations: { type: boolean, description: 'Confirms trimming or splitting the overlapped default allocations.' }
    AllocationCreated:
      type: object
      required: [allocation]
      properties:
        allocation: { $ref: '#/components/schemas/Allocation' }
        travelRequest: { type: string, nullable: true, description: 'Job number of the travel request created.' }
        emailsSent: { type: boolean }
    OverlapError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            overlaps:
              type: array
              items: { $ref: '#/components/schemas/TimelineItem' }
            defaultOverlaps:
              type: array
              description: Default (team) allocations that would be trimmed or split; resend with trimDefaultAllocations.
              items: { $ref: '#/components/schemas/TimelineItem' }
    TimelineItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [engagement, default] }
        engagementId: { type: string, nullable: true }
        label: { type: string, description: '"{code}: {title}" or "{code}: {type}".' }
        allocationType: { type: string }
        engagementCode: { type: string }
        color: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        hourly: { $ref: '#/components/schemas/Hourly' }
        clearanceStatus: { type: string }
        comment: { type: string, nullable: true }
        editable: { type: boolean, description: 'Default allocations that started at most 30 days ago.' }
    TimelineRow:
      type: object
      required: [person, items]
      properties:
        person: { $ref: '#/components/schemas/Employee' }
        items: { type: array, items: { $ref: '#/components/schemas/TimelineItem' } }
    TeamAllocationCreate:
      type: object
      required: [email, allocationTypeId, startDate, endDate]
      properties:
        email: { type: string }
        allocationTypeId: { type: integer }
        engagementCode: { type: string, description: 'Defaults to the type''s default engagement code.' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        comment: { type: string, maxLength: 255 }
        trimDefaultAllocations: { type: boolean, description: 'Ignored: the Team Allocations page refuses overlaps (legacy).' }
    BulkValidation:
      type: object
      required: [errors, valid]
      properties:
        errors: { type: array, items: { type: string } }
        valid:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              email: { type: string }
              team: { type: string }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              allocationType: { type: string }
        saved: { type: integer, description: 'Upload only.' }

